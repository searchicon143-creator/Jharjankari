<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>JharJankari Admin Panel</title><style>
:root{--bg:#f5f7fb;--surface:#fff;--surface2:#f8fafc;--text:#0f172a;--muted:#64748b;--primary:#0f766e;--primary2:#14b8a6;--accent:#f59e0b;--danger:#dc2626;--border:#e2e8f0;--shadow:0 10px 30px rgba(15,23,42,.07);--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.topline{height:4px;background:linear-gradient(90deg,var(--primary),var(--primary2),var(--accent))}header{background:#fff;border-bottom:1px solid var(--border)}.nav{max-width:1180px;margin:auto;padding:16px 18px;display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;color:#fff;font-size:25px}.brand h1{margin:0;font-size:22px}.brand small{color:var(--muted)}main{max-width:900px;margin:30px auto;padding:0 18px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:24px;box-shadow:var(--shadow);margin-bottom:18px}.panel h2{margin:0 0 18px}.input{width:100%;padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);color:var(--text);margin:7px 0 12px;font-size:16px}.btn{border:0;background:var(--primary);color:#fff;border-radius:11px;padding:11px 16px;font-weight:700}.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn.danger{background:var(--danger)}.row{display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px}.error{color:var(--danger);margin-top:10px}.success{color:var(--primary);margin-top:10px}.hidden{display:none!important}.block{border:1px dashed var(--border);border-radius:13px;padding:13px;margin:10px 0;position:relative;background:var(--surface2)}.block .rm{position:absolute;right:8px;top:7px;border:0;background:transparent;color:var(--danger);font-size:18px}.article-row{border:1px solid var(--border);border-radius:15px;padding:14px;margin:10px 0}.article-row h3{margin:0 0 6px}.stat{font-size:14px;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:25px}.top-actions{display:flex;gap:8px;margin:12px 0 20px}@media(max-width:600px){main{margin:18px auto;padding:0 12px}.panel{padding:18px}.row .btn{flex:1}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="topline"></div><header><div class="nav"><div class="logo">📰</div><div><h1>JharJankari</h1><small>Admin Panel</small></div></div></header><main>
<section id="loginPanel" class="panel"><h2>🔐 Admin Login</h2><div class="muted">Sirf administrator yahan se post manage kar sakta hai.</div><label>Admin Email</label><input id="email" class="input" type="email" autocomplete="username" placeholder="Email address"><label>Password</label><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Password"><div class="row"><button class="btn" onclick="login()">Login</button><button class="btn secondary" onclick="resetPassword()">Password bhool gaye?</button></div><div id="loginMsg"></div></section>
<section id="dash" class="hidden"><div class="top-actions"><button class="btn" onclick="openEditor()">＋ Naya Article</button><button class="btn secondary" onclick="location.href='/'">🌐 Public Site</button><button class="btn secondary" onclick="logout()">Logout</button></div><div class="panel"><h2>📊 Admin Dashboard</h2><div class="stat" id="stats">Loading...</div></div><div id="editor" class="panel hidden"></div><div class="panel"><h2>📰 Articles</h2><div id="articles">Loading...</div></div></section></main><footer>© JharJankari</footer>
<script>
const SUPABASE_URL='https://fqoqxjdaocbudooavsm.supabase.co';const SUPABASE_KEY='sb_publishable_rTmt6-cX-bY-JQ9SHUvUOQ_2VAnWNna';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let editingId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t,ok=false){const x=document.getElementById('loginMsg');x.className=ok?'success':'error';x.textContent=t}
async function login(){const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;if(!email||!password){msg('Email aur password daliye');return}const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){msg('Email ya password galat hai.');return}const ok=await checkAdmin(data.user.id);if(!ok){await sb.auth.signOut();msg('Is account ko admin permission nahi hai.');return}showDash()}
async function checkAdmin(uid){const {data,error}=await sb.from('admin_users').select('id').eq('id',uid).maybeSingle();return !error&&!!data}
async function resetPassword(){const email=document.getElementById('email').value.trim();if(!email){msg('Pehle email daliye');return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/admin.html'});msg(error?error.message:'Password reset link email par bhej diya gaya.',!error)}
async function logout(){await sb.auth.signOut();location.reload()}
function showDash(){document.getElementById('loginPanel').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');loadArticles()}
function block(type,val={}){let h='<div class="block" data-type="'+type+'"><button class="rm" onclick="this.parentElement.remove()">×</button><b>'+type.toUpperCase()+'</b>';if(type==='heading')h+='<input class="input btext" placeholder="Heading" value="'+esc(val.text)+'">';if(type==='text')h+='<textarea class="input btext" rows="5" placeholder="Article text">'+esc(val.text)+'</textarea>';if(type==='image')h+='<input class="input burl" placeholder="Image URL https://..." value="'+esc(val.url)+'">';if(type==='link')h+='<input class="input btext" placeholder="Link name" value="'+esc(val.text)+'"><input class="input burl" placeholder="Link URL" value="'+esc(val.url)+'">';return h+'</div>'}
function openEditor(a=null){editingId=a?.id||null;const e=document.getElementById('editor');e.classList.remove('hidden');e.innerHTML=`<h2>${a?'✏️ Edit Article':'✍️ Naya Article'}</h2><input id="title" class="input" placeholder="Article title" value="${esc(a?.title||'')}"><div id="blocks"></div><div class="row"><button class="btn secondary" onclick="addBlock('heading')">＋ Heading</button><button class="btn secondary" onclick="addBlock('text')">＋ Text</button><button class="btn secondary" onclick="addBlock('image')">＋ Image</button><button class="btn secondary" onclick="addBlock('link')">＋ Link</button></div><div class="row" style="margin-top:14px"><button class="btn secondary" onclick="closeEditor()">Cancel</button><button class="btn" onclick="saveArticle()">Publish</button></div>`;if(a?.blocks)(a.blocks||[]).forEach(b=>addBlock(b.type,b));e.scrollIntoView({behavior:'smooth'})}
function addBlock(type,val={}){document.getElementById('blocks').insertAdjacentHTML('beforeend',block(type,val))}
function closeEditor(){document.getElementById('editor').classList.add('hidden');editingId=null}
function collectBlocks(){return [...document.querySelectorAll('#blocks .block')].map(x=>{const t=x.dataset.type;const text=x.querySelector('.btext')?.value.trim()||'';const url=x.querySelector('.burl')?.value.trim()||'';return t==='image'?{type:t,url}:t==='link'?{type:t,text,url}:{type:t,text}}).filter(x=>x.text||x.url)}
async function saveArticle(){const title=document.getElementById('title').value.trim();if(!title){alert('Title daliye');return}const blocks=collectBlocks();const {data:{user}}=await sb.auth.getUser();if(!user){alert('Login expired');location.reload();return}const payload={title,blocks,updated_at:new Date().toISOString()};if(!editingId){payload.created_at=new Date().toISOString();payload.published=true}let q;if(editingId)q=await sb.from('articles').update(payload).eq('id',editingId);else q=await sb.from('articles').insert(payload);if(q.error){alert('Save failed: '+q.error.message);return}alert('Article published');closeEditor();loadArticles()}
async function loadArticles(){const {data,error}=await sb.from('articles').select('*').order('created_at',{ascending:false});if(error){document.getElementById('articles').textContent='Articles load failed: '+error.message;return}document.getElementById('stats').textContent=(data?.length||0)+' articles';const box=document.getElementById('articles');if(!data?.length){box.innerHTML='<div class="muted">Abhi koi article nahi hai.</div>';return}box.innerHTML=data.map(a=>'<div class="article-row"><h3>'+esc(a.title)+'</h3><div class="stat">'+esc(new Date(a.updated_at||a.created_at).toLocaleString('hi-IN'))+'</div><div class="row" style="margin-top:8px"><button class="btn secondary" onclick="editArticle(\''+esc(a.id)+'\')">Edit</button><button class="btn danger" onclick="deleteArticle(\''+esc(a.id)+'\')">Delete</button></div></div>').join('')}
async function editArticle(id){const {data,error}=await sb.from('articles').select('*').eq('id',id).single();if(!error)openEditor(data)}
async function deleteArticle(id){if(!confirm('Is article ko delete karein?'))return;const {error}=await sb.from('articles').delete().eq('id',id);if(error)alert(error.message);else loadArticles()}
async function boot(){const {data}=await sb.auth.getSession();if(data.session&&await checkAdmin(data.session.user.id))showDash()}boot();
</script></body></html>
